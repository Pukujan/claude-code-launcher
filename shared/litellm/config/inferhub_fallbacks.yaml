# Fallback chains for Claude Code's slots and the direct ih/ names (consumed by scripts/merge_litellm_config.py).
# Policy (Alex): only IRE recommendation-eligible Top20 routes, each < $0.10 USDC per 1M tokens
# ("effectively free"). Live price + tool/stream checked 2026-09-30 with inferhub-live.ps1 and
# streaming /v1/messages+tools probes. Re-check before adding a route.
# Rules applied by the generator to the ih/ roles below (not to the slots):
#   - the model behind the name itself is removed from its own chain;
#   - models above max_cost_per_mtok or not eligible are skipped.
max_cost_per_mtok: 0.10
models:
  cb/deepseek-v4.1-flash:   {vendor: deepseek, rail: cb,   cost_per_mtok: 0.022, eligible: true}
  cbcn/glm-5.3-flash:       {vendor: zhipu,    rail: cbcn, cost_per_mtok: 0.033, eligible: true}
  cbcn/deepseek-v4-flash:   {vendor: deepseek, rail: cbcn, cost_per_mtok: 0.047, eligible: true}
  ali/qwen3.8-flash:        {vendor: alibaba,  rail: ali,  cost_per_mtok: 0.008, eligible: true}
  cbcn/minimax-m3:          {vendor: minimax,  rail: cbcn, cost_per_mtok: 0.052, eligible: true}
  # seat-only (gated / not used as fallback targets), listed so vendor exclusion works
  ag/gemini-3.8-flash-high: {vendor: google,   rail: ag,   cost_per_mtok: 0.066, eligible: false}
# CKFF is dead (Alex, 2026-10-04). One switch: while this is false no CKFF model, alias,
# fallback or key reaches the proxy. CCL_CKFF=on overrides it for one run.
ckff_enabled: false

# Claude Code's own slots (issue #53). Each slot is a chain of real routes, first model
# first. These are the defaults; the onboarding picks in the seat file win over them
# (scripts/slots.py). Every slot gets its own copy of each fallback model, and the last
# model of a chain is never benched. The chains are Alex's picks, so the price cap and
# eligibility rules below do not apply to them (Astra is $0.05 in / $0.25 out).
#   sonnet  main conversation
#   opus    planning (the launcher's planner sub-agent runs on opus)
#   haiku   background calls and cheap sub-agents; same chain as sonnet, must handle tools
#   fable   the advisor; a different order from sonnet so it isn't reviewing its own work
slots:
  sonnet: {chain: [cb/deepseek-v4.1-flash, ali/qwen3.8-flash, cbcn/glm-5.3-flash]}
  opus:   {chain: [cb/gpt-6-astra, cx/gpt-6.1-sol, ali/qwen3.8-max-0902]}
  haiku:  {chain: [cb/deepseek-v4.1-flash, ali/qwen3.8-flash, cbcn/glm-5.3-flash]}
  fable:  {chain: [cbcn/glm-5.3-flash, ali/qwen3.8-flash, cb/deepseek-v4.1-flash]}

# Chains for the direct ih/ names (not slots), filtered by the price and eligibility rules.
roles:
  small_fast:
    names: [ih/ali/qwen3.8-flash]
    chain: [cb/deepseek-v4.1-flash, cbcn/deepseek-v4-flash]
  direct_deepseek:
    names: [ih/cb/deepseek-v4.1-flash]
    chain: [cbcn/deepseek-v4-flash, ali/qwen3.8-flash]

# Failure policy (Alex, 2026-10-03): when the 1st model fails, try the 2nd, then the 3rd.
# Each model gets 3 retries on rate-limit and 5xx errors before the request moves on.
# Applied to every slot name, every slot fallback and every ih/ chain target. CCL_RETRIES overrides the
# retry count on a machine (merge_litellm_config.py). Timeouts, bad requests and auth
# errors are not retried. A bad request still moves on to the next model in the chain
# (LiteLLM falls back on any error once retries are done), which is what carries a
# content-filter 400 over to another rail; it just isn't retried on the same model.
retry_policy:
  RateLimitErrorRetries: 3
  InternalServerErrorRetries: 3
  ServiceUnavailableErrorRetries: 3
  TimeoutErrorRetries: 0
  BadRequestErrorRetries: 0
  AuthenticationErrorRetries: 0

# Benching (issue #36 follow-up): applied to model_info of every slot name and every chain
# target except the last model of each slot chain (that one gets cooldown_time 0, so a
# chain always ends on a live attempt instead of "all deployments in cooldown"), so a failing primary is skipped for cooldown_time seconds and requests go straight to
# the backup. allowed_fails_policy uses explicit exception types so it also applies to
# single-deployment groups (LiteLLM otherwise never benches those). A route is benched when its
# failures within the window exceed the allowed count. The allowed count equals the retries, so
# the failure that uses up a model's last retry benches it for cooldown_time seconds (180 s,
# CCL_COOLDOWN_S overrides). After that the 1st model is tried again.
# Note: LiteLLM never benches on raw connection errors (APIConnectionError).
cooldown:
  cooldown_time: 180
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 3        # InferHub 402 no_provider_under_bid maps here
    InternalServerErrorAllowedFails: 3
    ServiceUnavailableErrorAllowedFails: 3
    BadGatewayErrorAllowedFails: 3        # InferHub 502
    TimeoutErrorAllowedFails: 1
    AuthenticationErrorAllowedFails: 0
    NotFoundErrorAllowedFails: 0